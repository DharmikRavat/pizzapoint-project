services:
  - type: web
    name: pizzapoint-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: pizzapoint-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
    rootDir: backend

  - type: web
    name: pizzapoint-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pizzapoint-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: pizzapoint-db
    databaseName: mahadev_pizza
    user: admin
    plan: free
