<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Mahadev Pizza Point</title>
  </head>
  <body>
    <!-- Global Loader -->
    <div id="global-loader" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease-out;">
      <div style="width: 60px; height: 60px; border: 6px solid #f3f3f3; border-top: 6px solid #EF4444; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <h2 style="margin-top: 20px; font-family: 'Poppins', sans-serif; font-weight: 700; color: #EF4444; font-size: 1.5rem;">PizzaPoint</h2>
      <p style="color: #6b7280; font-family: 'Inter', sans-serif; font-size: 0.875rem; margin-top: 5px;">Loading deliciousness...</p>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
